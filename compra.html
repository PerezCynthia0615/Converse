    <h1 style="text-align:left; font-size:50px;">CONVERSE ★❯</h1>
    <div class="login-card">
    <h2>Realiza tu compra</h2>
    <form action="guardar_compra.php" method="POST">
    <div class=form-group>
        <label>Nombre Completo:</label>
        <input type="text" name="nombre" required>
    </div>
    <div class=form-group>
        <label>Teléfono / WhatsApp:</label>
        <input type="tel" name="telefono" required>
    </div>
    <div class=form-group>
        <label>Correo Electrónico:</label>
        <input type="email" name="email" required>
    </div>
    <div class=form-group>
        <label for="cantidad">Cantidad:</label>
        <input type="number" name="cantidad" required>
    </div>

        <input type="text"  name="direccion" required>
    </div>

        <label for="ciudad">Ciudad y Estado:</label>
        <input type="text" name="ciudad" required>
    </div>
    <div class=form-group>

        <input type="text" name="cp" required>
    </div>
        <div class="form-group">
    <label>Metodo de pago:</label><br>
    <select name="pago">
        <option value="1">Transferencia bancaria</option>
        <option value="2">Paypal</option>
    </select>
    </div>

    <div class=form-group>
        <br>
        <label>Notas o instrucciones de entrega:</label>
        <br>
        <textarea name="notas" rows="4" cols="40"></textarea>
    </div>
    <div class=form-group>
        <br>
